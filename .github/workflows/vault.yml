# ハーネスと Vault の検査。決定: .kit/harness/docs/adr/0005-checks-in-ci.md
# 各端末の PKM Git の push でも動く。人のノートの書式の問題は警告だけで、失敗にしない。
name: vault

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # wiki の操作のコミットを遡って検査するため
      - name: Node の版を mise.toml から読む
        id: versions
        run: echo "node=$(sed -nE 's/^node *= *"(.*)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
      # 検査の一覧は verify.mjs にだけ書く（yamayu-i/pkm-kit#17）。CI だけで要るものは引数で渡す
      - name: 検査（verify.mjs）
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE..HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $GITHUB_SHA"
          else
            RANGE="$BEFORE..$GITHUB_SHA"
          fi
          node .claude/scripts/verify.mjs --fetch "--append-only=$RANGE"

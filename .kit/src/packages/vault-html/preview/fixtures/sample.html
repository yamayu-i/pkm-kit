<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユーザー体験の定義（見本）</title>
<style>
body {
	margin: 0;
	padding: var(--vt-space-24) var(--vt-space-16);
	background: var(--vt-surface);
	color: var(--vt-on-surface);
	font-family: var(--font-text);
	font-size: var(--vt-type-body-medium-size);
	line-height: var(--vt-type-body-medium-line-height);
}
main {
	max-width: 720px;
	margin: 0 auto;
}
h1 {
	font-size: var(--vt-type-headline-small-size);
	font-weight: var(--vt-type-headline-small-weight);
	line-height: var(--vt-type-headline-small-line-height);
	margin: 0 0 var(--vt-space-16);
}
h2 {
	font-size: var(--vt-type-title-medium-size);
	font-weight: var(--vt-type-title-medium-weight);
	line-height: var(--vt-type-title-medium-line-height);
	margin: var(--vt-space-24) 0 var(--vt-space-8);
}
p {
	margin: 0 0 var(--vt-space-12);
}
a {
	color: var(--vt-primary);
}
.note {
	color: var(--vt-on-surface-variant);
	font-size: var(--vt-type-body-small-size);
	line-height: var(--vt-type-body-small-line-height);
}
table {
	border-collapse: collapse;
	width: 100%;
}
th,
td {
	text-align: left;
	padding: var(--vt-space-8);
	border-bottom: var(--vt-border-width-thin) solid var(--vt-outline-variant);
}
th {
	font-size: var(--vt-type-label-medium-size);
	font-weight: var(--vt-type-label-medium-weight);
	color: var(--vt-on-surface-variant);
}
.card {
	background: var(--vt-surface-container);
	border-radius: var(--vt-radius-m);
	padding: var(--vt-space-12);
	margin: var(--vt-space-12) 0;
}
code {
	font-family: var(--font-monospace);
	background: var(--vt-surface-container-high);
	border-radius: var(--vt-radius-xs);
	padding: 0 var(--vt-space-4);
}
img {
	width: var(--vt-space-24);
	height: var(--vt-space-24);
	vertical-align: middle;
}
</style>
</head>
<body>
<main>
<h1>ユーザー体験の定義（見本）</h1>
<p class="note">vault-html の表示の見本。値はトークン（<code>var(--vt-…)</code>）だけで書いている。</p>
<h2>場面</h2>
<p>朝、今日やることを決める。<a href="../topics/foo.md">関連するノート</a>と<a href="#terms">用語</a>。</p>
<div class="card"><img src="asset/dot.png" alt=""> カードの中の画像（Vault の中の画像を data: に置き換えたもの）</div>
<h2 id="terms">概念と用語</h2>
<table>
<thead><tr><th>用語</th><th>意味</th></tr></thead>
<tbody>
<tr><td>Do Date</td><td>その issue に取りかかる予定の日</td></tr>
<tr><td>Inbox</td><td>まだ整理していない issue の置き場</td></tr>
<tr><td>Board</td><td>今日やるものを並べた面</td></tr>
</tbody>
</table>
</main>
</body>
</html>

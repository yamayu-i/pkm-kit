<!doctype html>
<!-- preview 用の偽の Draw.io（embed の JSON protocol の一部）。https://embed.diagrams.net/ の代わりに Playwright が返す -->
<html><head><meta charset="utf-8"></head><body>
<script>
	const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
	const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
	window.received = [];
	window.spinning = false;
	window.addEventListener("message", (e) => {
		const msg = JSON.parse(e.data);
		window.received.push(msg);
		// 本物と同じく、スピナーが出ているときは spin / spinKey 付きの export をしない（#98）
		if (msg.action === "spinner") {
			window.spinning = msg.show !== false;
			return;
		}
		if (msg.action === "export") {
			if ((msg.spin != null || msg.spinKey != null) && window.spinning) return;
			// 保存した XML から描いた、ことにする SVG
			const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" content="${esc(msg.xml)}"><rect width="40" height="20" fill="#fff" stroke="#000"/></svg>`;
			parent.postMessage(JSON.stringify({ event: "export", format: msg.format, data: "data:image/svg+xml;base64," + b64(svg), message: msg }), "*");
		}
	});
	window.send = (msg) => parent.postMessage(JSON.stringify(msg), "*");
	window.send({ event: "init" });
</script>
</body></html>
